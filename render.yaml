services:
  - type: web
    name: boli-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install "setuptools<82" && pip install --no-build-isolation -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WHISPER_MODEL
        value: tiny
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: CORS_ORIGINS
        value: "*"
